[project]
name = "causal-inference-sim"
version = "1.0.0"
description = "Quadrotor swarm simulation (PyBullet) with GNSS/INS navigation filters and causal analysis of failures"
readme = "README.md"
requires-python = ">=3.11,<3.13"  # no prebuilt pybullet wheel for 3.13

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["runs", "logs", "results", "causal_out", ".conda"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",   # long lines: left to the formatter (strings and comments)
    "E741",   # short names (l, I) taken from the equations
    "B905",   # zip(strict=...): Python 3.10+, not needed here
]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
